<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobConnect - Entrevistas</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../entrevistas.css">

</head>

<body>

    <header class="header">

        <h1>JobConnect</h1>

        <nav>

            <a href="../index.html">
                Inicio
            </a>

            <a href="postulaciones.html">
                Postulaciones
            </a>

            <a href="entrevistas.html">
                Entrevistas
            </a>

        </nav>

    </header>


    <main class="container">

        <section class="titulo">

            <h2>
                Gestión de Entrevistas
            </h2>

            <p>
                Registra y administra las entrevistas de los candidatos.
            </p>

        </section>


        <section class="formulario">

            <h3>
                Nueva entrevista
            </h3>


            <form id="formEntrevista">


                <div class="campo">

                    <label for="postulacion">
                        Postulación
                    </label>

                    <select
                        id="postulacion"
                        required
                    >

                        <option value="">
                            Seleccione una postulación
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input
                        type="date"
                        id="fecha"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="hora">
                        Hora
                    </label>

                    <input
                        type="time"
                        id="hora"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="resultado">
                        Resultado
                    </label>

                    <select
                        id="resultado"
                        required
                    >

                        <option value="Pendiente">
                            Pendiente
                        </option>

                        <option value="Aprobado">
                            Aprobado
                        </option>

                        <option value="Rechazado">
                            Rechazado
                        </option>

                    </select>

                </div>


                <div class="campo campo-notas">

                    <label for="notas">
                        Notas
                    </label>

                    <textarea
                        id="notas"
                        rows="4"
                        placeholder="Escriba las observaciones de la entrevista..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Registrar entrevista
                </button>


            </form>

        </section>


        <section class="tabla-section">

            <h3>
                Entrevistas registradas
            </h3>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Candidato</th>

                        <th>Vacante</th>

                        <th>Fecha</th>

                        <th>Hora</th>

                        <th>Resultado</th>

                        <th>Notas</th>

                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody id="tablaEntrevistas"></tbody>

            </table>

        </section>

    </main>


    <script src="../JS/api.js"></script>

    <script src="../JS/entrevistas.js"></script>

</body>

</html>
