<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

    <title>JobConnect</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="header">

        <h1>

        <nav>

    <main class="container">

        </section>


        <div
            style="

            <a

                style="

                    padding: 30px;
                    border-radius: 10px;

                    color: #1f2937;

                    📄 Postulaciones

            <a

                    background: white;
                    padding: 30px;
